name: Reportar un error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: que
    attributes:
      label: ¿Qué pasó?
      description: Cuéntalo con tus palabras y, si puedes, qué esperabas que pasara.
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para repetirlo
      placeholder: "1. Abrí una nota\n2. Hice clic en…\n3. Pasó…"
    validations: { required: true }
  - type: dropdown
    id: so
    attributes:
      label: Sistema operativo
      options: [Windows 10/11, Ubuntu / Debian, Fedora / otra distribución, Otro]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Versión de Libreta
      placeholder: "1.1.2"
    validations: { required: true }
  - type: dropdown
    id: instalacion
    attributes:
      label: Cómo la instalaste
      options: [Instalador de Windows, Portable de Windows, .deb, AppImage, Desde el código fuente]
  - type: textarea
    id: extra
    attributes:
      label: Capturas o mensajes de error
      description: No incluyas contenido privado de tus notas.
