name: Publicar versión
# Al subir una etiqueta (por ejemplo v1.2.0) compila en Windows y Linux
# y adjunta los instaladores a una Release de GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx vite build
      - run: npx electron-builder --linux AppImage deb --publish never
        if: runner.os == 'Linux'
      - run: npx electron-builder --win nsis portable --publish never
        if: runner.os == 'Windows'
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/Libreta*.exe
