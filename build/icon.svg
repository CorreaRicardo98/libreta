<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Libreta</title>
  <!-- cuadro: azul tinta de la app -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="#2640c4"/>
  <!-- una «L» hecha con una sola cinta doblada: tramo vertical en blanco papel,
       tramo horizontal en amarillo marcador, unidos por un inglete a 45° -->
