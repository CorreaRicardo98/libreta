<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' libreta: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://localhost:5173 libreta:">
  <title>Libreta</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app" data-sidebar="open">
    <aside class="sidebar" aria-label="Carpetas">
      <div class="side-scroll">
        <nav id="nav-main"></nav>
        <div id="smart-block" hidden>
          <div class="side-title">Inteligentes</div>
          <nav id="nav-smart"></nav>
        </div>
        <div class="side-title">Carpetas</div>
        <nav id="nav-folders"></nav>
        <div id="tags-block" hidden>
          <div class="side-title">Etiquetas</div>
          <nav id="nav-tags"></nav>
        </div>
      </div>
      <button class="side-add" id="btn-new-folder" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h3.4l1.6 1.8h6A1.5 1.5 0 0 1 17 8.3v6.2a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 9.5v3.5M8.25 11.25h3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Nueva…
      </button>
    </aside>

    <section class="list-pane" aria-label="Lista de notas">
      <header class="list-head">
        <button class="icon-btn only-narrow" id="btn-side" type="button" title="Carpetas" aria-label="Mostrar carpetas">
          <svg viewBox="0 0 20 20"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="list-title">
          <h1 id="list-name">Todas las notas</h1>
          <span id="list-count" class="muted"></span>
        </div>
        <div class="seg" role="group" aria-label="Vista">
          <button type="button" id="v-list" class="seg-btn" title="Como lista (Ctrl+1)" aria-label="Como lista" aria-pressed="true">
            <svg viewBox="0 0 20 20"><path d="M4 5.5h12M4 10h12M4 14.5h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button type="button" id="v-gallery" class="seg-btn" title="Como galería (Ctrl+2)" aria-label="Como galería" aria-pressed="false">
            <svg viewBox="0 0 20 20"><rect x="3.5" y="3.5" width="5.5" height="5.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="3.5" width="5.5" height="5.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3.5" y="11" width="5.5" height="5.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="5.5" height="5.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </div>
        <button class="btn-primary btn-square" id="btn-new" type="button" title="Nota nueva (Ctrl+N)" aria-label="Nota nueva">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="search-row"><div class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Buscar en todas las notas" aria-label="Buscar notas" autocomplete="off">
      </div>
          <button class="icon-btn" id="btn-sort" type="button" title="Ordenar" aria-label="Ordenar notas">
            <svg viewBox="0 0 20 20"><path d="M6 4v12m0 0-2.5-2.5M6 16l2.5-2.5M14 16V4m0 0-2.5 2.5M14 4l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
      </div>
      <div id="list" class="list" tabindex="-1"></div>
    </section>

    <main class="editor-pane" aria-label="Editor">
      <div id="editor-empty" class="empty-editor">
        <p class="empty-big">Nada abierto</p>
        <p class="muted">Elige una nota de la lista o empieza una nueva con <kbd>Ctrl</kbd> <kbd>N</kbd>.</p>
      </div>
      <div id="lock-screen" class="lock-screen" hidden>
        <form id="lock-form">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4.5" y="9" width="11" height="7.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 9V6.8a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          <p class="empty-big">Nota bloqueada</p>
          <p class="muted">Escribe la contraseña para leerla y editarla.</p>
          <input type="password" id="lock-pass" placeholder="Contraseña" aria-label="Contraseña de la nota" autocomplete="off">
          <p class="form-error" id="lock-error" role="alert"></p>
          <button type="submit" class="btn-primary">Abrir nota</button>
        </form>
      </div>
      <div id="editor-wrap" hidden>
        <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formato">
          <button class="icon-btn only-narrow" id="btn-back" type="button" aria-label="Volver a la lista" title="Volver a la lista">
            <svg viewBox="0 0 20 20"><path d="m12 4-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <select id="tb-style" aria-label="Estilo de párrafo">
            <option value="p">Cuerpo</option>
            <option value="h1">Título</option>
            <option value="h2">Encabezado</option>
            <option value="h3">Subencabezado</option>
            <option value="code">Monoespaciado</option>
          </select>
          <span class="tb-sep"></span>
          <button type="button" data-cmd="bold" title="Negrita (Ctrl+B)" aria-label="Negrita"><b>N</b></button>
          <button type="button" data-cmd="italic" title="Cursiva (Ctrl+I)" aria-label="Cursiva"><i>C</i></button>
          <button type="button" data-cmd="underline" title="Subrayado (Ctrl+U)" aria-label="Subrayado"><u>S</u></button>
          <button type="button" data-cmd="strike" title="Tachado" aria-label="Tachado"><s>T</s></button>
          <button type="button" data-cmd="highlight" title="Resaltar" aria-label="Resaltar">
            <svg viewBox="0 0 20 20"><path d="m5 13 6.8-6.8 3 3L8 16H5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M4 18h12" stroke="#f2b705" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
          <span class="tb-sep"></span>
          <button type="button" data-cmd="task" title="Lista de tareas (Ctrl+Shift+9)" aria-label="Lista de tareas">
            <svg viewBox="0 0 20 20"><rect x="3.5" y="4" width="5" height="5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m4.7 6.5 1.2 1.2 2-2.3M11 6.5h6M11 13.5h6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="3.5" y="11" width="5" height="5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button type="button" data-cmd="bullet" title="Lista con viñetas" aria-label="Lista con viñetas">
            <svg viewBox="0 0 20 20"><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="14" r="1.2" fill="currentColor"/><path d="M8.5 6h8.5M8.5 14H17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button type="button" data-cmd="ordered" title="Lista numerada" aria-label="Lista numerada">
            <svg viewBox="0 0 20 20"><text x="2.5" y="8" font-size="6.5" font-family="sans-serif" fill="currentColor">1</text><text x="2.5" y="16" font-size="6.5" font-family="sans-serif" fill="currentColor">2</text><path d="M8.5 6h8.5M8.5 14H17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button type="button" data-cmd="quote" title="Cita" aria-label="Cita en bloque">
            <svg viewBox="0 0 20 20"><path d="M4 4v12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8.5 7h8M8.5 10.5h8M8.5 14h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <span class="tb-sep"></span>
          <button type="button" data-cmd="table" title="Insertar tabla" aria-label="Insertar tabla">
            <svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 8.5h14M8 8.5V16" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button type="button" data-cmd="link" title="Enlace (Ctrl+K)" aria-label="Enlace">
            <svg viewBox="0 0 20 20"><path d="M8.5 11.5a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2l-.9.9M11.5 8.5a3 3 0 0 0-4.2 0l-2.6 2.6a3 3 0 0 0 4.2 4.2l.9-.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button type="button" data-cmd="image" title="Insertar imagen" aria-label="Insertar imagen">
            <svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="7.5" cy="8.5" r="1.3" fill="currentColor"/><path d="m4 15 4-4 3 3 2-2 3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" data-cmd="file" title="Adjuntar archivo" aria-label="Adjuntar archivo">
            <svg viewBox="0 0 20 20"><path d="m15.5 9.5-5.6 5.6a3.2 3.2 0 0 1-4.5-4.5l6-6a2.1 2.1 0 0 1 3 3l-6 6a1 1 0 0 1-1.5-1.5l5.4-5.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" data-cmd="draw" title="Dibujar" aria-label="Dibujar">
            <svg viewBox="0 0 20 20"><path d="m4 16 .8-3.4L13.6 3.8a1.6 1.6 0 0 1 2.3 0l.3.3a1.6 1.6 0 0 1 0 2.3L7.4 15.2z M12.4 5l2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
          <button type="button" data-cmd="scan" title="Escanear documento" aria-label="Escanear documento">
            <svg viewBox="0 0 20 20"><path d="M3.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2M13 3.5h2A1.5 1.5 0 0 1 16.5 5v2M16.5 13v2a1.5 1.5 0 0 1-1.5 1.5h-2M7 16.5H5A1.5 1.5 0 0 1 3.5 15v-2M3.5 10h13" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <span class="tb-grow"></span>
          <button type="button" id="tb-lock" title="Bloquear nota" aria-label="Bloqueo de la nota" aria-haspopup="menu">
            <svg viewBox="0 0 20 20"><rect x="4.5" y="9" width="11" height="7.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7 9V6.8a3 3 0 0 1 6 0V9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button type="button" id="tb-pin" title="Fijar nota" aria-label="Fijar nota" aria-pressed="false">
            <svg viewBox="0 0 20 20"><path d="M7 3.5h6l-.8 4 2.3 3H5.5l2.3-3zM10 10.5V17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
          <button type="button" id="tb-menu" title="Más acciones" aria-label="Más acciones" aria-haspopup="menu">
            <svg viewBox="0 0 20 20"><circle cx="4.5" cy="10" r="1.4" fill="currentColor"/><circle cx="10" cy="10" r="1.4" fill="currentColor"/><circle cx="15.5" cy="10" r="1.4" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="doc-scroll" id="doc-scroll">
          <div class="doc">
            <div class="doc-date muted" id="doc-date"></div>
            <div id="editor"></div>
          </div>
        </div>
        <div class="trash-bar" id="trash-bar" hidden>
          <span>Esta nota está en la papelera y no se puede editar.</span>
          <button type="button" id="btn-restore" class="btn-primary">Recuperar nota</button>
        </div>
        <div class="backlinks" id="backlinks" hidden></div>
        <footer class="statusbar muted" id="statusbar"></footer>
      </div>
    </main>
  </div>
  <div id="menu-layer"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
